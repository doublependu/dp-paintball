# Builds the game and publishes it to GitHub Pages.
#
# Follows the workflow recommended by https://vite.dev/guide/static-deploy,
# which uploads the built `dist/` as a Pages artifact rather than committing it
# to a `gh-pages` branch. Actions are pinned to the SHAs that guide publishes.
#
# Requires Settings > Pages > Source to be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# The minimum the deploy-pages action needs: `id-token` for the deployment's
# OIDC claim, `pages` to publish, `contents` only to check the source out.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages holds one live deployment, so queue rather than race. In-progress runs
# are cancelled because a superseded build is never the one we want to publish.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `tsc --noEmit` first, so a type error fails the
      # deploy instead of shipping. The Playwright suites in `tools/` are not
      # run here — they drive a real browser against a preview server, which is
      # a separate concern from publishing.
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
